name: Build ARM64 Docker Image

# 触发条件：push 到 main 分支，或手动触发
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 Tag（默认使用 latest）'
        required: false
        default: 'latest'

env:
  # -------------------------------------------------------
  # 修改为你自己的镜像仓库信息
  # 支持 Docker Hub 或 GHCR（GitHub Container Registry）
  #
  # Docker Hub 示例：  your-dockerhub-username/file-search
  # GHCR 示例：        ghcr.io/${{ github.repository_owner }}/file-search
  # -------------------------------------------------------
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/file-search

jobs:
  build-and-push:
    name: Build ARM64 Image & Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # 推送到 GHCR 必须

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 17（用于 Maven 编译；项目运行时仍用 JDK 11）
      - name: Set up JDK 17 for Maven build
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 打包（跳过单元测试）
      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      # 4. 安装 QEMU（支持跨架构构建 ARM64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # 5. 初始化 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. 登录到 GHCR
      #    如需推送到 Docker Hub，改用：
      #      uses: docker/login-action@v3
      #      with:
      #        username: ${{ secrets.DOCKERHUB_USERNAME }}
      #        password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. 生成镜像 Tag
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 手动触发时使用输入的 tag
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}
            # 同时打上 git short SHA，方便回溯
            type=sha,prefix=sha-,format=short

      # 8. 构建并推送 ARM64 镜像
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.arm64          # 使用 ARM64 专用 Dockerfile
          platforms: linux/arm64            # 只构建 ARM64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 启用 GitHub Actions 缓存加速二次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. 打印结果
      - name: Print image digest
        run: |
          echo "✅ ARM64 镜像构建并推送成功！"
          echo "镜像: ${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
