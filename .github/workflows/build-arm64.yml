name: Build ARM64 Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 Tag（默认 latest）'
        required: false
        default: 'latest'

jobs:
  build-and-push:
    name: Build ARM64 & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Maven build
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub
      # 需要在仓库 Settings → Secrets 中添加：
      #   DOCKERHUB_USERNAME  你的 Docker Hub 用户名
      #   DOCKERHUB_TOKEN     Docker Hub 的 Access Token（非密码）
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/file-search
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push ARM64 image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print result
        run: |
          echo "✅ 构建推送成功！"
          echo "镜像：${{ secrets.DOCKERHUB_USERNAME }}/file-search"
          echo "Tags：${{ steps.meta.outputs.tags }}"
          echo "Digest：${{ steps.build-push.outputs.digest }}"
